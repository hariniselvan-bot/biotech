<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f1117;
color:white;
text-align:center;
overflow:hidden;
}

/* PARTICLES */

.particles span{
position:absolute;
width:4px;
height:4px;
background:#22d3ee;
border-radius:50%;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);opacity:0}
50%{opacity:1}
100%{transform:translateY(-1000px);opacity:0}
}

/* CONTAINER */

.error-box{
position:relative;
z-index:10;
max-width:600px;
animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(40px);}
to{opacity:1; transform:translateY(0);}
}

/* 404 TEXT */

.error-code{
font-size:140px;
font-weight:800;
color:#22d3ee;
text-shadow:0 0 25px #22d3ee;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{text-shadow:0 0 15px #22d3ee;}
50%{text-shadow:0 0 40px #22d3ee;}
100%{text-shadow:0 0 15px #22d3ee;}
}

/* ICON */

.icon{
font-size:70px;
margin-bottom:10px;
color:#22d3ee;
animation:floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon{
0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}
}

/* TEXT */

.error-title{
font-size:28px;
margin:10px 0;
}

.error-text{
color:#9ca3af;
margin-bottom:30px;
}

/* BUTTON */

.home-btn{
display:inline-block;
padding:14px 28px;
background:#22d3ee;
border-radius:30px;
text-decoration:none;
color:#0f1117;
font-weight:600;
transition:.3s;
box-shadow:0 0 20px rgba(34,211,238,0.4);
}

.home-btn:hover{
transform:translateY(-5px);
box-shadow:0 0 35px rgba(34,211,238,0.8);
background:#0ea5b7;
}

/* MOBILE */

@media(max-width:600px){

.error-code{
font-size:90px;
}

.error-title{
font-size:22px;
}

}

/* PARTICLE POSITION */

.particles span:nth-child(1){left:10%; animation-delay:0s}
.particles span:nth-child(2){left:25%; animation-delay:2s}
.particles span:nth-child(3){left:40%; animation-delay:4s}
.particles span:nth-child(4){left:55%; animation-delay:1s}
.particles span:nth-child(5){left:70%; animation-delay:3s}
.particles span:nth-child(6){left:85%; animation-delay:5s}

</style>
</head>

<body>

<div class="particles">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="error-box">

<div class="icon">
<i class="fa fa-triangle-exclamation"></i>
</div>

<div class="error-code">404</div>

<h2 class="error-title">Page Not Found</h2>

<p class="error-text">
Oops! The page you are looking for doesn't exist.
</p>

<a href="javascript:history.back()" class="home-btn">
<i class="fa fa-arrow-left"></i> Go Back
</a>

</div>

<script>

function goBack(){

if(document.referrer !== ""){
window.history.back();
}else{
window.location.href="home.html";
}

}

</script>

</body>
</html>
