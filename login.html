<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Premium Header</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:200vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* HEADER */

header{

position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);

width:92%;
max-width:1250px;

display:flex;
align-items:center;
justify-content:space-between;

padding:14px 28px;

border-radius:18px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.18);

z-index:1000;

overflow:hidden;

}

/* animated gradient border */

header::before{

content:"";

position:absolute;
inset:-2px;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.6),
transparent
);

opacity:.4;

animation:borderGlow 6s linear infinite;

}

@keyframes borderGlow{

0%{transform:translateX(-100%)}
100%{transform:translateX(100%)}

}

/* LOGO */

.logo{
color:white;
font-size:26px;
font-weight:700;
letter-spacing:0.8px;
z-index:2;
}

/* NAV */

nav{

display:flex;
gap:32px;
z-index:2;

}

nav a{
color:white;
text-decoration:none;
font-size:17px;
opacity:.9;
font-weight:500;

position:relative;

transition:0.3s;

}

/* hover underline */

nav a::after{

content:"";

position:absolute;
bottom:-5px;
left:0;

width:0%;
height:2px;

background:white;

transition:0.3s;

}

nav a:hover::after{

width:100%;

}

nav a:hover{

opacity:1;
transform:translateY(-2px);

}

/* RIGHT SIDE */

.right{

display:flex;
align-items:center;
gap:18px;
z-index:2;

}

.login{
color:white;
text-decoration:none;
font-size:16px;
opacity:.9;
font-weight:500;
}

/* signup button */

.signup{
padding:10px 22px;
border-radius:30px;

background:rgba(255,255,255,0.12);
color:white;

border:1px solid rgba(255,255,255,0.35);

text-decoration:none;
font-size:16px;
font-weight:600;

backdrop-filter:blur(10px);

transition:all 0.3s ease;
}

/* hover effect */

.signup:hover{

background:rgba(255,255,255,0.25);

transform:translateY(-2px);

box-shadow:0 8px 20px rgba(0,0,0,0.25);

}
/* HAMBURGER */

.hamburger{

display:none;

width:28px;
height:20px;

flex-direction:column;
justify-content:space-between;

cursor:pointer;

z-index:1001;

}

.hamburger span{

height:3px;
width:100%;

background:white;

border-radius:3px;

transition:.4s;

}

/* HAMBURGER ANIMATION */

.hamburger.active span:nth-child(1){

transform:rotate(45deg) translateY(8px);

}

.hamburger.active span:nth-child(2){

opacity:0;

}

.hamburger.active span:nth-child(3){

transform:rotate(-45deg) translateY(-8px);

}

/* MOBILE MENU */

.mobile-menu{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(10,20,30,.96);

backdrop-filter:blur(20px);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

gap:35px;

opacity:0;
pointer-events:none;

transition:.5s;

z-index:999;

}

.mobile-menu.active{

opacity:1;
pointer-events:auto;

}

/* MENU LINKS */

.mobile-menu a{

color:white;

font-size:36px;
font-weight:600;
}
{
text-decoration:none;

opacity:0;
transform:translateY(40px);

animation:menuAnim .6s forwards;

}       
.mobile-menu.active a:nth-child(1){animation-delay:.1s}
.mobile-menu.active a:nth-child(2){animation-delay:.2s}
.mobile-menu.active a:nth-child(3){animation-delay:.3s}
.mobile-menu.active a:nth-child(4){animation-delay:.4s}
.mobile-menu.active a:nth-child(5){animation-delay:.5s}
.mobile-menu.active a:nth-child(6){animation-delay:.6s}
.mobile-menu.active a:nth-child(7){animation-delay:.7s}

@keyframes menuAnim{

to{
opacity:1;
transform:translateY(0);
}
}
.logo img{
height:36px;
width:auto;
filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}
/* MOBILE */

@media(max-width:900px){

nav{
display:none;
}

.right{
display:none;
}

.hamburger{
display:flex;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
    <img src="logo.webp" alt="Stackly Logo">
</div>

<nav>
<a href="home.html">HOME</a>
<a href="about.html">ABOUT</a>
<a href="blog.html">BLOG</a>
<a href="careers.html">CAREERS</a>
<a href="contact.html">CONTACT US</a>
</nav>

<div class="right">
<a href="login.html" class="login">Log in</a>
<a href="signup.html" class="signup">Sign up for free</a>
</div>

<div class="hamburger" id="hamburger">
<span></span>
<span></span>
<span></span>
</div>

</header>

<div class="mobile-menu" id="mobileMenu">

<a href="home.html">HOME</a>
<a href="about.html">ABOUT</a>
<a href="blog.html">BLOG</a>
<a href="careers.html">CAREERS</a>
<a href="contact.html">CONTACT US</a>
<a href="login.html">LOG IN</a>
<a href="signup.html">SIGN UP</a>

</div>

<script>

const hamburger=document.getElementById("hamburger");
const menu=document.getElementById("mobileMenu");

hamburger.onclick=()=>{

hamburger.classList.toggle("active");
menu.classList.toggle("active");

}

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.6)),
url("bg.webp") center/cover no-repeat;
}

/* LOGIN CARD */

.login-card{
width:360px;
padding:60px 40px 40px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
border-radius:20px;
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 20px 50px rgba(0,0,0,0.6);
position:relative;
text-align:center;
}

/* ICON */

.user-icon{
position:absolute;
top:-45px;
left:50%;
transform:translateX(-50%);
width:90px;
height:90px;
background:#173f11;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
color:white;
}

/* INPUTS */

.input-group{
display:flex;
align-items:center;
background:rgba(255,255,255,0.85);
margin-bottom:18px;
border-radius:6px;
overflow:hidden;
}

.input-group i{
padding:12px;
background:#e5e5e5;
color:#444;
}

.input-group input,
.input-group select{
border:none;
outline:none;
padding:12px;
flex:1;
font-size:14px;
}

/* OPTIONS */

.options{
display:flex;
justify-content:space-between;
font-size:13px;
color:white;
margin-bottom:20px;
}

.options a{
color:#ddd;
text-decoration:none;
}

/* BUTTON */

.login-btn{
width:100%;
padding:14px;
background:#173f11;
color:white;
border:none;
border-radius:6px;
font-weight:600;
cursor:pointer;
letter-spacing:1px;
}

.login-btn:hover{
background:#0f2c0a;
}

</style>
</head>

<body>

<div class="login-card">

<div class="user-icon">
<i class="fa-regular fa-user"></i>
</div>

<form id="loginForm">

<div class="input-group">
<i class="fa fa-user"></i>
<input type="email" placeholder="Email ID" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" placeholder="Password" required>
</div>

<div class="input-group">
<i class="fa fa-user-tag"></i>

<select id="role" required>
<option value="">Select Role</option>
<option value="admin">Admin</option>
<option value="researcher">Researcher</option>
<option value="patient">Patient</option>
</select>

</div>

<div class="options">

<label>
<input type="checkbox" id="remember"> Remember me
</label>

<a href="404.html">Forgot Password?</a>

</div>

<button class="login-btn">LOGIN</button>

</form>

</div>

<script>

const form = document.getElementById("loginForm");
const role = document.getElementById("role");
const remember = document.getElementById("remember");

form.addEventListener("submit", function(e){

if(!form.checkValidity()){

e.preventDefault();
form.reportValidity();

}else{

e.preventDefault();

/* ROLE REDIRECT */

if(role.value === "admin"){
window.location.href="admindashboard.html";
}

else if(role.value === "researcher"){
window.location.href="researcherdashboard.html";
}

else if(role.value === "patient"){
window.location.href="patientdashboard.html";
}

}

});

/* REMEMBER ME CLICK */

remember.addEventListener("click",function(){
window.location.href="";
});

</script>

</body>
</html>
