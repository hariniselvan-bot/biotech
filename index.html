<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#05080c;
overflow:hidden;
color:white;
}

/* PARTICLE BACKGROUND */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#0fa4af33 2px,transparent 3px);
background-size:60px 60px;
animation:particles 20s linear infinite;
opacity:.4;
}

@keyframes particles{

0%{transform:translate(0,0)}
100%{transform:translate(-200px,-200px)}

}

/* LOADER CONTAINER */

.loader{
text-align:center;
animation:zoom 4s ease forwards;
}

/* CAMERA ZOOM EFFECT */

@keyframes zoom{

0%{
transform:scale(.5);
opacity:0;
}

40%{
transform:scale(1);
opacity:1;
}

80%{
transform:scale(1.2);
}

100%{
transform:scale(2);
opacity:0;
}

}

/* LOGO REVEAL */

.logo{

font-size:70px;
font-weight:700;
letter-spacing:10px;

background:linear-gradient(90deg,#0fa4af,#ffffff,#0fa4af);
background-size:200%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:shine 3s linear infinite;
}

@keyframes shine{

0%{background-position:0%}
100%{background-position:200%}

}

/* SUBTITLE */

.subtitle{

margin-top:10px;
letter-spacing:4px;
font-size:14px;
color:#aaa;

}

/* LOADING DOTS */

.dots{
margin-top:30px;
font-size:28px;
letter-spacing:8px;
}

.dots span{
animation:blink 1.5s infinite;
}

.dots span:nth-child(2){
animation-delay:.2s;
}

.dots span:nth-child(3){
animation-delay:.4s;
}

@keyframes blink{

0%,100%{opacity:0}
50%{opacity:1}

}

</style>
</head>

<body>

<div class="loader">

<div class="logo">STACKLY</div>

<div class="subtitle">INITIALIZING SYSTEM</div>

<div class="dots">
<span>.</span>
<span>.</span>
<span>.</span>
</div>

</div>

<script>

/* Redirect after animation */

setTimeout(()=>{

window.location.href="home.html";

},4000);

</script>

</body>
</html>
